services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE: ${JWT_EXPIRE:-7d}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ML_SERVICE_URL: http://ml-service:5001
    depends_on:
      - ml-service

  ml-service:
    build:
      context: ./server
      dockerfile: Dockerfile.ml
    ports:
      - "5001:5001"
