name: Keep Render Services Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Node server
        run: curl -fsS "$NODE_SERVICE_URL/api/health"
        env:
          NODE_SERVICE_URL: ${{ secrets.NODE_SERVICE_URL }}

      - name: Ping ML service
        run: curl -fsS "$ML_SERVICE_URL/health"
        env:
          ML_SERVICE_URL: ${{ secrets.ML_SERVICE_URL }}
